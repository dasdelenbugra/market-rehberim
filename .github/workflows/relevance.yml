# Canlı kaynağa karşı alaka ölçümü.
#
# Farklı bir soruyu cevaplar: "kodum bozuldu mu?" değil, **"kaynak değişti mi?"**
# marketfiyati.org.tr katalogunu kendi takvimine göre güncelliyor; bir ürünün
# adı değiştiğinde ya da bir terim katalogdan düştüğünde sıralamamız sessizce
# bozulur. Birim testler bunu göremez, çünkü sabit veriyle çalışırlar.
#
# Bu yüzden push'ta değil haftada bir çalışır: dış bir servise yükü ölçülü
# tutar, ve kaynak kaynaklı bir kırmızı, kod kaynaklı kırmızıyla karışmaz.
#
# Elle de çalıştırılabilir: GitHub'da Actions sekmesi -> bu workflow ->
# "Run workflow". Sıralama kuralına dokunduktan sonra bunu kullan.
#
# Not: GitHub, 60 gün hiç hareket görmeyen depolarda zamanlanmış workflow'ları
# durdurur. Depo uykuya yatarsa Actions sekmesinden yeniden etkinleştirilir.
name: alaka ölçümü

on:
  schedule:
    # Her pazartesi 06:00 UTC (Türkiye saatiyle 09:00).
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: flask_backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: flask_backend/requirements.txt

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Canlı kaynağa karşı ölç
        # Script mock'u kendisi kapatıyor ve beklenti kaymışsa 1 ile çıkıyor.
        # Beklentiler tools/relevance_cases.json içinde.
        run: python tools/check_relevance.py
